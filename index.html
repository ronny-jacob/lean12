<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d5ed4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lean 12">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<title>Lean 12 – training log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eceff2; --surface:#ffffff; --surface2:#e3e8ed; --text:#131a21; --muted:#56626e; --line:#cfd7de;
  --A:#1d5ed4; --B:#b87a00; --C:#18864a; --accent:var(--A);
  --danger:#c0392b; --ok:#18864a; --warn:#b87a00; --on-accent:#fff;
  --disp:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1216; --surface:#171d23; --surface2:#222a32; --text:#e8edf1; --muted:#93a0ab; --line:#2b3540;
    --A:#6a9bff; --B:#f0b43a; --C:#45c37d; --danger:#ff7b6b; --ok:#45c37d; --warn:#f0b43a; --on-accent:#0e1216;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1216; --surface:#171d23; --surface2:#222a32; --text:#e8edf1; --muted:#93a0ab; --line:#2b3540;
  --A:#6a9bff; --B:#f0b43a; --C:#45c37d; --danger:#ff7b6b; --ok:#45c37d; --warn:#f0b43a; --on-accent:#0e1216;
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 4px}
.brand{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:.02em;color:var(--muted)}
.themebtn{width:36px;height:36px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.themebtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.themeseg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px}
.themeseg button{min-height:36px;padding:0 13px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted)}
.themeseg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent;min-height:100vh}
body[data-day="A"]{--accent:var(--A)} body[data-day="B"]{--accent:var(--B)} body[data-day="C"]{--accent:var(--C)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:600;letter-spacing:.01em;line-height:1.05}
#app{padding:14px 14px 170px;max-width:640px;margin:0 auto}
.muted{color:var(--muted)} .small{font-size:13.5px} .tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card>h2{font-size:22px;margin-bottom:8px}
.btn{min-height:48px;padding:0 18px;border-radius:12px;background:var(--surface2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.chip{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border-radius:99px;background:var(--surface2);font-size:13.5px;font-weight:500;white-space:nowrap}
.chip.acc{background:var(--accent);color:var(--on-accent)}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:56px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-family:var(--disp);font-size:28px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{color:var(--on-accent);border-color:transparent}
.seg button[data-d="A"][aria-pressed="true"]{background:var(--A)} .seg button[data-d="B"][aria-pressed="true"]{background:var(--B)} .seg button[data-d="C"][aria-pressed="true"]{background:var(--C)}
.hero{display:flex;align-items:flex-end;gap:14px;margin:6px 0 14px}
.hero .big{font-family:var(--disp);font-weight:700;font-size:104px;line-height:.8;color:var(--accent)}
.hero h1{font-size:30px} .hero p{margin:4px 0 0}
.ex{display:flex;align-items:stretch;gap:0;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 8px;min-height:64px;overflow:hidden}
.ex .rail{width:6px;flex:none;background:var(--line)}
.ex.pair-top{margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:1px dashed var(--line)}
.ex.pair-bot{border-top-left-radius:0;border-top-right-radius:0;margin-bottom:8px;border-top:0}
.ex.pair-top .rail,.ex.pair-bot .rail{background:var(--accent)}
.ex.done .rail{background:var(--ok)}
.ex .tag{font-family:var(--disp);font-size:26px;font-weight:700;width:46px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.ex .mid{padding:10px 8px 10px 0;flex:1;min-width:0}
.ex .nm{font-weight:600;line-height:1.2}
.ex .st{font-family:var(--disp);font-size:20px;font-weight:600;padding:0 12px;display:flex;align-items:center;color:var(--muted);flex:none}
.ex.done .st{color:var(--ok)}
.pairnote{font-size:12px;color:var(--muted);margin:-4px 0 8px 52px}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
.tabbar button{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:10px}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--accent)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(100%);transition:transform .22s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet .in{max-width:640px;margin:0 auto;padding:0 14px 150px}
.sheet .top{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 0 8px;display:flex;align-items:center;gap:8px}
.sheet .top h2{font-size:23px;flex:1;min-width:0}
.iconbtn{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.diagram{width:100%;display:block;border-radius:12px;border:1px solid var(--line);background:#f3f6f9}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;position:relative;cursor:zoom-in}
.pair img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;border-radius:12px;border:1px solid var(--line);background:#d9eef8}
.pair .n{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:99px;background:var(--text);color:var(--bg);font:700 15px/26px var(--disp);text-align:center}
.pair .n.two{left:calc(50% + 11px)}
.credit{font-size:12px;color:var(--muted);margin:14px 2px 0}
.credit a{color:inherit}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 52px;gap:8px;align-items:center;margin:0 0 10px}
.setrow .n{font-family:var(--disp);font-size:26px;font-weight:700;color:var(--muted);text-align:center}
.stepper{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;height:58px}
.stepper button{width:38px;font-size:24px;font-weight:600;color:var(--accent);background:var(--surface2)}
.stepper .val{flex:1;min-width:0;position:relative}
.stepper input{width:100%;height:100%;border:0;background:transparent;text-align:center;font-family:var(--disp);font-size:28px;font-weight:700;padding:8px 0 0}
.stepper .u{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:10.5px;color:var(--muted);pointer-events:none}
.check{width:52px;height:58px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center}
.check svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.sugg{border-left:5px solid var(--accent);background:var(--surface);border-radius:10px;padding:10px 12px;margin:12px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.sugg.up{border-left-color:var(--ok)}
.sugg b{font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{min-width:46px;min-height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600;padding:0 12px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.lbl{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 8px}
summary{list-style:none;padding:13px 14px;min-height:48px;display:flex;align-items:center;justify-content:space-between;font-weight:600;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;color:var(--muted);font-family:var(--disp)}
details[open]>summary::after{content:"–"}
details .body{padding:0 14px 12px}
details ul{margin:6px 0;padding-left:20px} details li{margin:3px 0}
.field{margin:0 0 12px}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.inp{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:17px}
textarea.inp{padding:10px 12px;min-height:84px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .v{font-family:var(--disp);font-size:34px;font-weight:700;line-height:1}
.stat .k{font-size:12.5px;color:var(--muted);margin-top:4px}
.bar{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.pill{display:inline-block;padding:6px 12px;border-radius:99px;font-weight:600;font-size:14px}
.pill.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--danger) 20%,transparent);color:var(--danger)}
.pill.idle{background:var(--surface2);color:var(--muted)}
.foodgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.food{min-height:56px;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:6px 10px;text-align:left}
.food b{display:block;font-size:14px;line-height:1.2} .food span{font-size:12px;color:var(--muted)}
.timer{position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--text);color:var(--bg);border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;max-width:620px;margin:0 auto}
.timer.on{display:flex}
.timer .t{font-family:var(--disp);font-size:34px;font-weight:700;min-width:70px}
.timer .prog{flex:1;height:8px;border-radius:99px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
.timer .prog i{display:block;height:100%;background:var(--bg)}
.timer button{min-height:40px;padding:0 12px;border-radius:10px;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:80;font-weight:600;font-size:14px;max-width:90%;display:none}
.toast.on{display:block}
.banner{background:color-mix(in srgb,var(--warn) 20%,var(--surface));border:1px solid var(--warn);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.pre{display:flex;gap:10px;align-items:center;min-height:52px}
.pre .check{width:44px;height:44px;flex:none}
table{width:100%;border-collapse:collapse;font-size:14px} th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left} th{font-weight:600;color:var(--muted);font-size:12.5px}
svg.chart{width:100%;height:auto;display:block}
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(8,10,12,.94);display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.lightbox.on{display:block}
.lightbox img{width:min(100% - 24px,640px);display:block;margin:12px auto;border-radius:12px;background:#d9eef8}
.lightbox .gap{height:64px}
.lightbox .iconbtn{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:2;background:var(--surface);color:var(--text)}
.lightbox .hint{position:fixed;top:calc(24px + env(safe-area-inset-top,0px));left:16px;color:#cfd6dc;font-size:13px;z-index:2}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>

(neutral grip)","img":"lat_pulldown","sets":3,"low":8,"high":12,"rir":"1-2","rest":"90 s after the pair","pair":"Superset with 2A","where":"Technogym lat machine (photo 2). Handles are on the floor beside it.","setup":["Clip on the V-handle or close neutral handle (palms facing).","Thigh pads snug on your thighs; seat so your arms are almost straight at the top.","Lifting straps or wraps are fine."],"cues":["Lean back about 10 degrees, chest up.","Start by pulling shoulder blades down, then drive elbows to your ribs.","Bar to upper chest, then let it back up slowly to a full stretch.","No swinging; never pull behind the neck."],"swap":"No neutral handle: straight bar, grip just wider than shoulders, wrists wrapped.","primary":"Back","sec1":"Biceps","sec2":"","step":2.5,"restSec":90},{"id":"seated_leg_curl","day":"A","tag":"3","name":"Seated leg curl","img":"seated_leg_curl","sets":2,"low":10,"high":15,"rir":"0-1","rest":"60-90 s","pair":"Alone","where":"Technogym leg extension / leg curl machine (photo 3). Ask staff how to switch it to curl mode.","setup":["Align your knees with the machine's pivot point.","Thigh pad snug; roller sits on your lower calf just above the heel.","Start with a light stack to find the right setup."],"cues":["Curl heels under you, squeeze for 1 second.","Take 3 seconds to return. Don't let the stack slam."],"swap":"Foot pain on the roller: pad it with a folded towel. Or do DB Romanian deadlift extra sets.","primary":"Hamstrings","sec1":"","sec2":"","step":2.5,"restSec":75},{"id":"cable_lateral_raise","day":"A","tag":"4A","name":"Cable lateral raise","img":"cable_lateral_raise","sets":3,"low":12,"high":20,"rir":"0-1","rest":"60 s","pair":"Superset with 4B","where":"A cable station with a low pulley (check on Day 1; see equipment check).","setup":["Handle on the lowest pulley. Stand side-on, cable across your body.","Hold the handle in the far hand, slight bend in the elbow."],"cues":["Lift your elbow out to the side up to shoulder height.", ap":"Back or foot trouble: Smith RDL with the empty bar, or extra leg curl sets.","primary":"Hamstrings","sec1":"Glutes","sec2":"","step":2,"restSec":120},{"id":"flat_db_press","day":"B","tag":"2A","name":"Flat dumbbell press (neutral grip)","img":"flat_db_press","sets":3,"low":8,"high":12,"rir":"1-2","rest":"90 s after the pair","pair":"Superset with 2B","where":"Adjustable bench set flat (photo 1) and dumbbells.","setup":["Lie back with DBs on your thighs, kick up one at a time.","Shoulder blades pinched, feet flat. Wrist wraps on."],"cues":["Lower until elbows are just below the bench, about 75 degrees from the body.","Press up over your chest. Squeeze at the top."],"swap":"Wrist pain: use a lighter load or Smith press.","primary":"Chest","sec1":"Triceps","sec2":"Shoulders","step":2,"restSec":30},{"id":"chest_supported_row","day":"B","tag":"2B","name":"Chest-supported dumbbell row","img":"chest_supported_row","sets":3,"low":8,"high":12,"rir":"1-2","rest":"90 s after the pair","pair":"Superset with 2A","where":"Adjustable bench at 30-45 degrees (photo 1) and dumbbells.","setup":["Lie face-down on the incline bench, chest on the pad, feet on the floor.","Hold DBs with palms facing each other (neutral grip). Use straps."],"cues":["Row elbows back toward your hips, pause 1 second.","Squeeze your shoulder blades; don't shrug or lift your chest off the pad."],"swap":"Bench not adjustable: Smith inverted row (Day C version).","primary":"Back","sec1":"Biceps","sec2":"Shoulders","step":2,"restSec":90},{"id":"leg_extension","day":"B","tag":"3","name":"Leg extension","img":"leg_extension","sets":2,"low":12,"high":15,"rir":"0-1","rest":"60-90 s","pair":"Alone","where":"Technogym leg extension / leg curl machine (photo 3), in extension mode.","setup":["Back against the pad, knees at the pivot, roller on the lower shin.","Start light; the knee should feel no pinch."],"cues":["Extend and squeeze quads for 1 second.","Lower for 3 seconds. Don't snap the knees straight."],"swap":"Front-of-knee pain: stop and tell your physio; swap for extra leg curl sets.","primary":"Quads","sec1":"","sec2":"","step":2.5,"restSec":75},{"id":"seated_db_lateral","day":"B","tag":"4A","name":"Seated dumbbell lateral raise","img":"seated_db_lateral","sets":3,"low":12,"high":20,"rir":"0-1","rest":"60 s","pair":"Superset with 4B","where":"Bench set upright (or any bench) and light dumbbells (4-8 kg).","setup":["Sit tall, DBs at your sides, slight bend in the elbows."],"cues":["Raise the DBs out to shoulder height, pinky slightly higher than thumb.","Pause 1 second, lower slowly. No swinging."],"swap":"Wrists complain: use wrist wraps or lighter DBs.","primary":"Shoulders","sec1":"","sec2":"","step":2,"restSec":30},{"id":"incline_db_curl","day":"B","tag":"4B","name":"Incline dumbbell curl","img":"incline_db_curl","sets":2,"low":10,"high":15,"rir":"0-1","rest":"60 s","pair":"Superset with 4A","where":"Adjustable bench at about 60 degrees and dumbbells (6-10 kg).","setup":["Sit back, let arms hang straight down behind your torso line."],"cues":["Curl up without moving the elbows forward.","Lower all the way down for a full stretch."],"swap":"Wrist pain: hammer grip (palms facing each other).","primary":"Biceps","sec1":"","sec2":"","step":2,"restSec":60},{"id":"reverse_crunch","day":"B","tag":"5","name":"Reverse crunch (flat bench)","img":"reverse_crunch","sets":2,"low":10,"high":15,"rir":"1","rest":"60 s","pair":"Alone","where":"Flat bench.","setup":["Lie on the bench, hold behind your head, knees above hips."],"cues":["Curl your pelvis up, knees toward chest. No swinging.","Lower slowly until your back is flat again."],"swap":"Neck or shoulder strain: do it on the floor with arms at your sides.","primary":"Abs","sec1":"","sec2":"","step":2.5,"restSec":60},{"id":"hip_thrust","day":"C","tag":"1","name":"Hip thrust (bench)","img":"hip_thrust","sets":3,"low":8,"high":12,"rir":"2","rest":"2 min","pair":"Alone","where":"Flat bench set against the wall or the Smith frame so it can't slide. Heavy DB or the Smith bar with a folded towel.","setup":["Upper back (just under the shoulder blades) on the bench edge.","Weight sits across your hip crease. Feet hip-width, shins vertical at the top.","Start with a 20-30 kg DB, or the empty Smith bar, then add."],"cues":["Chin tucked, ribs down. Push through the heels.","Top position: hips and torso in one line. Squeeze glutes for 1 second.","Don't over-arch your lower back."],"swap":"Foot/ankle pain pushing through the heel: bodyweight glute bridge, then add load slowly.","primary":"Glutes","sec1":"Hamstrings","sec2":"","step":5,"restSec":120},{"id":"smith_incline_press","day":"C","tag":"2A","name":"Smith incline press","img":"smith_incline_press","sets":3,"low":6,"high":10,"rir":"1-2","rest":"90 s after the pair","pair":"Superset with 2B","where":"Smith machine with an adjustable bench inside it.","setup":["Set the bench to 30 degrees, centred so the bar lands on your upper chest.","Set the safety stops just above your chest. Wrist wraps on."],"cues":["Lower to the upper chest with elbows about 75 degrees from your body.","Press straight up. Rotate the hooks to rack."],"swap":"Wrist pain: switch to a lighter DB incline press.","primary":"Chest","sec1":"Triceps","sec2":"Shoulders","step":2.5,"restSec":30},{"id":"smith_inverted_row","day":"C","tag":"2B","name":"Smith inverted row","img":"smith_inverted_row","sets":3,"low":8,"high":12,"rir":"1-2","rest":"90 s after the pair","pair":"Superset with 2A","where":"Smith machine bar set at about waist height. If a low cable row exists, you may use it instead.","setup":["Lie under the bar, arms straight, body in one straight line, heels on the floor.","Wrist wraps or straps. Too hard: bend your knees."],"cues":["Pull your chest to the bar, squeeze shoulder blades.","Keep hips up; lower under control."],"swap":"Can't reach 8 reps: bend knees. Too easy: raise your feet on the step platform.","primary":"Back","sec1":"Biceps","sec2":"Shoulders","step":2.5,"r ","tag":"5A","name":"Overhead DB triceps extension","img":"overhead_db_triceps","sets":2,"low":10,"high":15,"rir":"0-1","rest":"60 s","pair":"Superset with 5B","where":"Upright bench and one dumbbell (8-16 kg).","setup":["Sit with back supported. Hold one DB with both hands, overhead."],"cues":["Lower behind your head, elbows pointing up, then extend.","Keep upper arms still."],"swap":"Wrists complain: use the rope pushdown on a high pulley.","primary":"Triceps","sec1":"","sec2":"","step":2,"restSec":30},{"id":"hammer_curl","day":"C","tag":"5B","name":"Hammer curl","img":"hammer_curl","sets":2,"low":10,"high":15,"rir":"0-1","rest":"60 s","pair":"Superset with 5A","where":"Dumbbells (8-12 kg).","setup":["Stand tall, DBs at your sides, palms facing each other."],"cues":["Curl up, elbows pinned. No body swing.","Lower for 2-3 seconds."],"swap":"Same exercise at lower weight if wrists complain.","primary":"Biceps","sec1":"","sec2":"","step":2,"restSec":60}],"prehab":[{"name":"Wall tibialis raise","imgs":[],"dose":"1 x 15","how":"Back and hips against a wall, heels about 30 cm out. Lift your toes, hold 1 s, lower slowly."},{"name":"Calf raise (step platform)","imgs":["calf_raise"],"dose":"1 x 12, slow","how":"Both feet on the step edge, heels hanging off. Rise, pause 1 s, lower slowly. Pain-free range only."},{"name":"Ankle inversion/eversion","imgs":[],"dose":"1 x 12 each way","how":"Seated. Turn your sole inward, then outward, against a light band or your other foot. No band? Press the outer edge of the foot into a fixed object for 5 s, then the inner edge, x5 each."},{"name":"Short-foot drill","imgs":[],"dose":"30 s each foot","how":"Seated or standing. Draw your heel toward the ball of your foot to lift the arch without curling toes."},{"name":"Wrist flexion/extension","imgs":["wrist_flexion","wrist_extension"],"dose":"1 x 15 each","how":"Forearm on a bench, hand off the edge, 2-4 kg DB. Curl palm-up (flexion), then palm-down (extension). Slow and light."},{"name":"Forearm rotation","imgs":[],"dose":"1 x 10 each way","how":"Forearm on your thigh, hold one end of a 2 kg DB. Rotate palm up, then palm down, slowly."}],"notes":{"seated_leg_curl":"The picture shows the lying leg curl. Your Technogym machine is seated; the movement is the same: curl your heels toward your glutes.","smith_incline_press":"The picture shows a free bar on an incline bench. Yours runs inside the Smith machine, bench at about 30 degrees.","smith_inverted_row":"The picture shows a bar on a rack. Set the Smith bar at about waist height; the movement is the same.","reverse_crunch":"Shown on the floor. The bench version is the same movement.","rope_pushdown":"Shown with a bar. Use the rope and spread the ends apart at the bottom.","hip_thrust":"Shown with a dumbbell. A Smith bar with a folded towel also works.","lat_pulldown":"Shown with a V-bar handle.","calf_raise":"Shown holding the Smith bar for balance. Heels hang off the step edge.","overhead_db_triceps":"Hold one dumbbell with both hands, as shown."},"imgs":{"smith_squat":["data:image/webp;base64,UklGRlgpAABXRUJQVlA4IEwpAADQtACdASqQAZABPpVGnkulo6KipFJLQLASiWdu2BBXf8A5215//OfpXj/r7B3/j88bwL/xegB/SfXt5T88efxn02y+v3+uaW706B843p4283mU6PfoAdO1TwPpX/G+i7yX/oeIfmY+GSonD/VN+cfj3PN/Ud+/8H/J+gXk3/oOzQtb+zfsBe1X07/u+Gz/0ehP2A/Yz4Af1t/4nsV/oPEC+k/7j9rPgC/kP9o/Yb3if8H9u/Tr+j/6T2Hf6D/kP2K9uf2seiyWLGgKoDttXM+5Ns9LHBl6XtftrYe5Ol5286nFoKCn22NBPHLjZP2piTYVaRnU+mt4cAKpI090A+RBl6mvmrimQO26Ymrso1mhix7tNiL1+Jh4UbIvCUb8NI3dcf6PgC96rwP8DGUU86GMHt7i39LyaQ+v6Pincwfr4bjC62mXqWo3xXtjQEU4z5vLeKHYDVWUv6MY7jV1MUC61Ddei/9Lx1Pw/yjBK+9qJgRZAyAfZKiRxS9Rm7u05qsGB5qNx9YwGKJPKNpR6VAqgGBCQMdw5mbSpxWZHIvpf6QYvUut07nXWmWsll7qDPVMt62wMGDFPOTB7sKtSJ9jIZfKe1ZyKeUT0FbYAlmJ2mz3F8g/pcUrJNrlWzEVlVnhFU/VFw2cJWI2pMc+0uHaGU58G9qzPrsKjnuaAC++vGlD+BagzmYCwCFHrbFnxGmYsvMChs1XBkBbT6a4DH/ni/YeKSfO5qFRROL/icTYcgBRb9mVr3s+TCU0e9bOc5tdkA7bIaY6qcl2QO3pmdd8KEmnUEt+uxkWX7W/I0QmyUhnVZSOa1A+fdETaI2Ez4u4NXUYBSgcVqCL6FW47lI8n5210TVOluZLkonGSc7hScydYKB2CJCN25miibWcingg   app.appendChild(credit());
  var st=S.settings; var fields=[['start','Week 1 start (a Monday)','date'],['startWeight','Start weight (kg)','number'],['height','Height (cm)','number'],['kcal','Calorie target','number'],['protein','Protein target (g)','number'],['steps','Step target','number'],['goal','12-week goal weight (kg)','number']];
  var card=h('div',{class:'card'},h('h2',null,'Settings'));
  fields.forEach(function(f){ var inp=h('input',{class:'inp',type:f[2],inputmode:f[2]==='number'?'decimal':null,value:st[f[0]],onchange:function(){ if(f[2]==='number'){ var v=num(inp.value); if(v!=null) st[f[0]]=v; } else if(inp.value) st[f[0]]=inp.value; save(); toast('Saved'); }}); card.appendChild(h('div',{class:'field'},h('label',null,f[1]),inp)); });
  var th=h('select',{class:'inp',onchange:function(){st.theme=th.value;st.themeChosen=true;save();applyTheme();}}); [['auto','Match my phone'],['light','Light'],['dark','Dark']].forEach(function(o){ th.appendChild(h('option',{value:o[0],selected:st.theme===o[0]?'':null},o[1])); });
  card.appendChild(h('div',{class:'field'},h('label',null,'Theme'),th)); app.appendChild(card);

  var out=h('textarea',{class:'inp',style:'min-height:110px;font-size:12px',readonly:'',onclick:function(){out.select();}}); out.value='';
  var exp=h('div',{class:'card'},h('h2',null,'Back up'),h('p',{class:'small muted',style:'margin:0 0 10px'},'Your data lives only in this browser on this phone. Copy a backup now and then and paste it into Notes or a message to yourself.'),
    h('button',{type:'button',class:'btn block',onclick:function(){ out.value=JSON.stringify(S); out.select(); var done=function(){toast('Copied. Paste it somewhere safe.');}; try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(out.value).then(done,function(){toast('Select the text and copy it.');}); } else { document.execCommand('copy'); done(); } }catch(e){ toast('Select the text and copy it.'); } }},'Copy backup'),
    h('div',{style:'height:8px'}),out);
  app.appendChild(exp);
  var inn=h('textarea',{class:'inp',placeholder:'Paste a backup here',style:'min-height:90px;font-size:12px'});
  app.appendChild(h('div',{class:'card'},h('h2',null,'Restore'),inn,h('div',{style:'height:8px'}),h('button',{type:'button',class:'btn block',onclick:function(){ try{ var p=JSON.parse(inn.value); if(!p||typeof p!=='object'||!p.settings||!p.daily||!p.sessions) throw 0; if(!confirm('Replace everything on this phone with this backup?')) return; S=Object.assign(defaults(),p); save(); applyTheme(); toast('Restored'); UI.day=null; render(); }catch(e){ toast('That is not a valid backup.'); } }},'Restore backup')));
  app.appendChild(h('div',{class:'card'},h('h2',null,'Reset'),h('p',{class:'small muted',style:'margin:0 0 10px'},'Deletes every log on this phone.'),h('button',{type:'button',class:'btn danger block',onclick:function(){ if(confirm('Delete all logged data? This cannot be undone.')&&confirm('Really delete everything?')){ S=defaults(); save(); applyTheme(); UI.day=null; toast('All data cleared'); render(); } }},'Delete all data')));
}

document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&UI.sheet) wakeOn(); });
document.addEventListener('keydown',function(ev){ if(ev.key==='Escape'){ var lb=document.getElementById('lightbox'); if(lb.classList.contains('on')) lb.classList.remove('on'); else if(UI.sheet) closeSheet(); } });
render();
})();
</script>
