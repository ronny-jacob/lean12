<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#1d5ed4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lean 12">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<title>Lean 12 – training log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eceff2; --surface:#ffffff; --surface2:#e3e8ed; --text:#131a21; --muted:#56626e; --line:#cfd7de;
  --A:#1d5ed4; --B:#b87a00; --C:#18864a; --accent:var(--A);
  --danger:#c0392b; --ok:#18864a; --warn:#b87a00; --on-accent:#fff;
  --disp:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1216; --surface:#171d23; --surface2:#222a32; --text:#e8edf1; --muted:#93a0ab; --line:#2b3540;
    --A:#6a9bff; --B:#f0b43a; --C:#45c37d; --danger:#ff7b6b; --ok:#45c37d; --warn:#f0b43a; --on-accent:#0e1216;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1216; --surface:#171d23; --surface2:#222a32; --text:#e8edf1; --muted:#93a0ab; --line:#2b3540;
  --A:#6a9bff; --B:#f0b43a; --C:#45c37d; --danger:#ff7b6b; --ok:#45c37d; --warn:#f0b43a; --on-accent:#0e1216;
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 4px}
.brand{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:.02em;color:var(--muted)}
.themebtn{width:36px;height:36px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.themebtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.themeseg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px}
.themeseg button{min-height:36px;padding:0 13px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted)}
.themeseg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent;min-height:100vh}
body[data-day="A"]{--accent:var(--A)} body[data-day="B"]{--accent:var(--B)} body[data-day="C"]{--accent:var(--C)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:600;letter-spacing:.01em;line-height:1.05}
#app{padding:14px 14px 170px;max-width:640px;margin:0 auto}
.muted{color:var(--muted)} .small{font-size:13.5px} .tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card>h2{font-size:22px;margin-bottom:8px}
.btn{min-height:48px;padding:0 18px;border-radius:12px;background:var(--surface2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.chip{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border-radius:99px;background:var(--surface2);font-size:13.5px;font-weight:500;white-space:nowrap}
.chip.acc{background:var(--accent);color:var(--on-accent)}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:56px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-family:var(--disp);font-size:28px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{color:var(--on-accent);border-color:transparent}
.seg button[data-d="A"][aria-pressed="true"]{background:var(--A)} .seg button[data-d="B"][aria-pressed="true"]{background:var(--B)} .seg button[data-d="C"][aria-pressed="true"]{background:var(--C)}
.hero{display:flex;align-items:flex-end;gap:14px;margin:6px 0 14px}
.hero .big{font-family:var(--disp);font-weight:700;font-size:104px;line-height:.8;color:var(--accent)}
.hero h1{font-size:30px} .hero p{margin:4px 0 0}
.ex{display:flex;align-items:stretch;gap:0;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 8px;min-height:64px;overflow:hidden}
.ex .rail{width:6px;flex:none;background:var(--line)}
.ex.pair-top{margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:1px dashed var(--line)}
.ex.pair-bot{border-top-left-radius:0;border-top-right-radius:0;margin-bottom:8px;border-top:0}
.ex.pair-top .rail,.ex.pair-bot .rail{background:var(--accent)}
.ex.done .rail{background:var(--ok)}
.ex .tag{font-family:var(--disp);font-size:26px;font-weight:700;width:46px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.ex .mid{padding:10px 8px 10px 0;flex:1;min-width:0}
.ex .nm{font-weight:600;line-height:1.2}
.ex .st{font-family:var(--disp);font-size:20px;font-weight:600;padding:0 12px;display:flex;align-items:center;color:var(--muted);flex:none}
.ex.done .st{color:var(--ok)}
.pairnote{font-size:12px;color:var(--muted);margin:-4px 0 8px 52px}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
.tabbar button{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:10px}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--accent)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(100%);transition:transform .22s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet .in{max-width:640px;margin:0 auto;padding:0 14px 150px}
.sheet .top{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 0 8px;display:flex;align-items:center;gap:8px}
.sheet .top h2{font-size:23px;flex:1;min-width:0}
.iconbtn{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.diagram{width:100%;display:block;border-radius:12px;border:1px solid var(--line);background:#f3f6f9}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;position:relative;cursor:zoom-in}
.pair img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;border-radius:12px;border:1px solid var(--line);background:#d9eef8}
.pair .n{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:99px;background:var(--text);color:var(--bg);font:700 15px/26px var(--disp);text-align:center}
.pair .n.two{left:calc(50% + 11px)}
.credit{font-size:12px;color:var(--muted);margin:14px 2px 0}
.credit a{color:inherit}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 52px;gap:8px;align-items:center;margin:0 0 10px}
.setrow .n{font-family:var(--disp);font-size:26px;font-weight:700;color:var(--muted);text-align:center}
.stepper{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;height:58px}
.stepper button{width:38px;font-size:24px;font-weight:600;color:var(--accent);background:var(--surface2)}
.stepper .val{flex:1;min-width:0;position:relative}
.stepper input{width:100%;height:100%;border:0;background:transparent;text-align:center;font-family:var(--disp);font-size:28px;font-weight:700;padding:8px 0 0}
.stepper .u{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:10.5px;color:var(--muted);pointer-events:none}
.check{width:52px;height:58px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center}
.check svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.sugg{border-left:5px solid var(--accent);background:var(--surface);border-radius:10px;padding:10px 12px;margin:12px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.sugg.up{border-left-color:var(--ok)}
.sugg b{font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{min-width:46px;min-height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600;padding:0 12px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.lbl{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 8px}
summary{list-style:none;padding:13px 14px;min-height:48px;display:flex;align-items:center;justify-content:space-between;font-weight:600;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;color:var(--muted);font-family:var(--disp)}
details[open]>summary::after{content:"–"}
details .body{padding:0 14px 12px}
details ul{margin:6px 0;padding-left:20px} details li{margin:3px 0}
.field{margin:0 0 12px}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.inp{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:17px}
textarea.inp{padding:10px 12px;min-height:84px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .v{font-family:var(--disp);font-size:34px;font-weight:700;line-height:1}
.stat .k{font-size:12.5px;color:var(--muted);margin-top:4px}
.bar{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.pill{display:inline-block;padding:6px 12px;border-radius:99px;font-weight:600;font-size:14px}
.pill.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--danger) 20%,transparent);color:var(--danger)}
.pill.idle{background:var(--surface2);color:var(--muted)}
.foodgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.food{min-height:56px;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:6px 10px;text-align:left}
.food b{display:block;font-size:14px;line-height:1.2} .food span{font-size:12px;color:var(--muted)}
.timer{position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--text);color:var(--bg);border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;max-width:620px;margin:0 auto}
.timer.on{display:flex}
.timer .t{font-family:var(--disp);font-size:34px;font-weight:700;min-width:70px}
.timer .prog{flex:1;height:8px;border-radius:99px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
.timer .prog i{display:block;height:100%;background:var(--bg)}
.timer button{min-height:40px;padding:0 12px;border-radius:10px;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:80;font-weight:600;font-size:14px;max-width:90%;display:none}
.toast.on{display:block}
.banner{background:color-mix(in srgb,var(--warn) 20%,var(--surface));border:1px solid var(--warn);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.pre{display:flex;gap:10px;align-items:center;min-height:52px}
.pre .check{width:44px;height:44px;flex:none}
table{width:100%;border-collapse:collapse;font-size:14px} th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left} th{font-weight:600;color:var(--muted);font-size:12.5px}
svg.chart{width:100%;height:auto;display:block}
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(8,10,12,.94);display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.lightbox.on{display:block}
.lightbox img{width:min(100% - 24px,640px);display:block;margin:12px auto;border-radius:12px;background:#d9eef8}
.lightbox .gap{height:64px}
.lightbox .iconbtn{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:2;background:var(--surface);color:var(--text)}
.lightbox .hint{position:fixed;top:calc(24px + env(safe-area-inset-top,0px));left:16px;color:#cfd6dc;font-size:13px;z-index:2}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>

30},{"id":"lat_pulldown","day":"A","tag":"2B","name":"Lat pulldown (neutral grip)","img":"lat_pulldown","sets":3,"low":8,"high":12,"rir":"1-2","rest":"90 s after the pair","pair":"Superset with 2A","where":"Technogym lat machine (photo 2). Handles are on the floor beside it.","setup":["Clip on the V-handle or close neutral handle (palms facing).","Thigh pads snug on your thighs; seat so your arms are almost straight at the top.","Lifting straps or wraps are fine."],"cues":["Lean back about 10 degrees, chest up.","Start by pulling shoulder blades down, then drive elbows to your ribs.","Bar to upper chest, then let it back up slowly to a full stretch.","No swinging; never pull behind the neck."],"swap":"No neutral handle: straight bar, grip just wider than shoulders, wrists wrapped.","primary":"Back","sec1":"Biceps","sec2":"","step":2.5,"restSec":90},{"id":"seated_leg_curl","day":"A","tag":"3","name":"Seated leg curl","img":"seated_leg_curl","sets":2,"low":10,"high":15,"rir":"0-1","rest":"60-90 s","pair":"Alone","where":"Technogym leg extension / leg curl machine (photo 3). Ask staff how to switch it to curl mode.","setup":["Align your knees with the machine's pivot point.","Thigh pad snug; roller sits on your lower calf just above the heel.","Start with a light stack to find the right setup."],"cues":["Curl heels under you, squeeze for 1 second.","Take 3 seconds to return. Don't let the stack slam."],"swap":"Foot pain on the roller: pad it with a folded towel. If it still hurts, stop and tell your physio.","primary":"Hamstrings","sec1":"","sec2":"","step":2.5,"restSec":75},{"id":"smith_overhead_press","day":"A","tag":"4","name":"Smith overhead press (seated)","img":"smith_overhead_press","sets":2,"low":8,"high":12,"rir":"2","rest":"90 s","pair":"Alone","where":"Smith machine with the upright adjustable bench set inside it (backrest near vertical).","setup":["Centre the bench so the bar comes down in front of your face, not behind your head.","Set the safety stops just below chin height. Start with the empty bar.","Sit tall with ribs down and wrist wraps on. Unrack by rotating the hooks."],"cues":["Press straight up until your arms are almost straight.","Lower to about chin or collarbone level.","Don't arch your back. A pinch at the top of the shoulder means stop and use the swap."],"swap":"Pinching or sharp shoulder pain: skip it and add one set to the lateral raise. Tell your physio if it returns.","primary":"Shoulders","sec1":"Triceps","sec2":"","step":2.5,"restSec":90},{"id":"seated_db_lateral","day":"A","tag":"5","name":"Seated dumbbell lateral raise","img":"seated_db_lateral","sets":3,"low":12,"high":20,"rir":"0-1","rest":"60 s","pair":"Alone","where":"Bench set upright (or any bench) and light dumbbells (4-8 kg).","setup":["Sit tall, DBs at your sides, slight bend in the elbows."],"cues":["Raise the DBs out to shoulder height, pinky slightly higher than thumb.","Pause 1 second, lower slowly. No swinging."],"swap":"Wrists complain: use wrist wraps or lighter DBs.","primary":"Shoulders","sec1":"","sec2":"","step":2,"restSec":60},{"id":"hip_thrust","day":"B","tag":"1","name":"Smith hip thrust","img":"hip_thrust","sets":3,"low":8,"high":12,"rir":"2","rest":"2 min","pair":"Alone","where":"Smith machine with a flat bench set across inside it, bar padded with a folded towel.","setup":["Position the bench so the bar rolls over your hips when your upper back is on its edge.","Set the safety stops below hip height. Start with the empty bar and a folded towel on your hips.","Feet hip-width, shins vertical at the top. Unrack and re-rack by rotating the hooks."],"cues":["Chin tucked, ribs down. Push through the heels.","Top position: hips and torso in one line. Squeeze glutes for 1 second.","Don't over-arch your lower back."],"swap":"Heel or ankle pain: bodyweight glute bridge, then add load slowly. Smith feels awkward: hold a heavy dumbbell across your hips.","primary":"Glutes","sec1":"Hamstrings","sec2":"","step":5,"restSec":120},{"id":"smith_incline_press","day":"B","tag":"2A","name":"Smith incline press","img":"smith_incline_press","sets":3,"low":8,"high":12,"rir":"1-2","rest":"90 s after the pair","pair":"Superset with 2B","where":"Smith machine with an adjustable bench inside it.","setup":["Set the bench to 30 degrees, centred so the bar lands on your upper chest.","Set the safety stops just above your chest. Wrist wraps on."],"cues":["Lower to the upper chest with elbows about 75 degrees from your body.","Press straight up. Rotate the hooks to rack."],"swap":"Wrist pain: switch to a lighter DB incline press.","primary":"Chest","sec1":"Triceps","sec2":"Shoulders","step":2.5,"restSec":30},{"id":"smith_inverted_row","day":"B","tag":"2B","name":"Smith inverted row","img":"smith_inverted_row","sets":3,"low":8,"high":12,"rir":"1-2","rest":"90 s after the pair","pair":"Superset with 2A","where":"Smith machine bar set at about waist height. If a low cable row exists, you may use it instead.","setup":["Lie under the bar, arms straight, body in one straight line, heels on the floor.","Wrist wraps or straps. Too hard: bend your knees."],"cues":["Pull your chest to the bar, squeeze shoulder blades.","Keep hips up; lower under control."],"swap":"Can't reach 8 reps: bend knees. Too easy: raise your feet on the step platform.","primary":"Back","sec1":"Biceps","sec2":"Shoulders","step":2.5,"restSec":90},{"id":"lat_pulldown_wide","day":"B","tag":"3","name":"Lat pulldown (wide overhand grip)","img":"lat_pulldown_wide","sets":2,"low":10,"high":12,"rir":"1-2","rest":"90 s","pair":"Alone","where":"Technogym lat machine. Use the straight bar from the pile beside it.","setup":["Clip on the straight bar. Grip just wider than your shoulders, palms facing away, wrist wraps or straps on.","Thigh pads snug. Sit tall."],"cues":["Pull the bar to your upper chest, elbows pointing down and slightly forward.","Lean back only about 10 degrees. Let the bar rise slowly to a full stretch.","Never pull behind your neck."],"swap":"Wrist pain: use the neutral V-handle from Day A instead.","primary":"Back","sec1":"Biceps","sec2":"","step":2.5,"restSec":90},{"id":"leg_extension","day":"B","tag":"4","name":"Leg extension","img":"leg_extension","sets":2,"low":12,"high":15,"rir":"0-1","rest":"60-90 s","pair":"Alone","where":"Technogym leg extension / leg curl machine (photo 3), in extension mode.","setup":["Back against the pad, knees at the pivot, roller on the lower shin.","Start light; the knee should feel no pinch."],"cues":["Extend and squeeze quads for 1 second.","Lower for 3 seconds. Don't snap the knees straight."],"swap":"Front-of-knee pain: stop and tell your physio; swap for extra leg curl sets.","primary":"Quads","sec1":"","sec2":"","step":2.5,"restSec":75},{"id":"seated_db_lateral","day":"B","tag":"5","name":"Seated dumbbell lateral raise","img":"seated_db_lateral","sets":3,"low":12,"high":20,"rir":"0-1","rest":"60 s","pair":"Alone","where":"Bench set upright (or any bench) and light dumbbells (4-8 kg).","setup":["Sit tall, DBs at your sides, slight bend in the elbows."],"cues":["Raise the DBs out to shoulder height, pinky slightly higher than thumb.","Pause 1 second, lower slowly. No swinging."],"swap":"Wrists complain: use wrist wraps or lighter DBs.","primary":"Shoulders","sec1":"","sec2":"","step":2,"restSec":60}],"prehab":[{"name":"Wall tibialis raise","imgs":[],"dose":"1 x 15","how":"Back and hips against a wall, heels about 30 cm out. Lift your toes, hold 1 s, lower slowly."},{"name":"Calf raise (step platform)","imgs":["calf_raise"],"dose":"1 x 12, slow","how":"Both feet on the step edge, heels hanging off. Rise, pause 1 s, lower slowly. Pain-free range only."},{"name":"Ankle inversion/eversion","imgs":[],"dose":"1 x 12 each way","how":"Seated. Turn your sole inward, then outward, against a light band or your other foot. No band? Press the outer edge of the foot into a fixed object for 5 s, then the inner edge, x5 each."},{"name":"Short-foot drill","imgs":[],"dose":"30 s e function h(tag, props){
  var el = document.createElement(tag);
  if(props) for(var k in props){ var v = props[k]; if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k==='html') el.innerHTML=v;
    else if(k.slice(0,2)==='on') el.addEventListener(k.slice(2), v);
    else if(k==='value') el.value=v;
    else el.setAttribute(k, v===true?'':v); }
  for(var i=2;i<arguments.length;i++) add(el, arguments[i]);
  return el;
}
function add(el, kid){
  if(kid==null||kid===false) return;
  if(Array.isArray(kid)){ kid.forEach(function(k){add(el,k);}); return; }
  el.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
}

function startRest(sec){
  if(!sec) return; timer={end:Date.now()+sec*1000,total:sec}; clearInterval(timerI); drawTimer(); timerI=setInterval(drawTimer,250);

function drawTimer(){
  var el=document.getElementById('timer'); if(!timer){el.classList.remove('on');return;}
  var left=Math.max(0,Math.ceil((timer.end-Date.now())/1000));
  el.classList.add('on'); el.textContent='';
  var pct=Math.max(0,Math.min(100,(timer.end-Date.now())/(timer.total*10)));
  el.appendChild(h('div',{class:'t'},Math.floor(left/60)+':'+pad(left%60)));
  el.appendChild(h('div',{class:'prog'},h('i',{style:'width:'+pct+'%'})));
  el.appendChild(h('button',{type:'button',onclick:function(){timer.end+=15000;timer.total+=15;drawTimer();}},'+15 s'));
  el.appendChild(h('button',{type:'button',onclick:function(){stopTimer();}},'Skip'));
  if(left<=0){ beep(); toast('Rest over. Next set.'); stopTimer(); }
}

function suggest(e, beforeKey){
  var last=lastEx(e.id, beforeKey);
  if(!last) return {kind:'first', text:'First time: pick a load that leaves about 3 reps in the tank on set 1. Start light.', load:null, reps:e.low};
  var minR=Math.min.apply(null,last.sets.map(function(x){return x.r;}));
  var lastLoad=last.sets[last.sets.length-1].l;
  var line=last.sets.map(function(x){return x.r;}).join(', ');
  var lastTxt=(lastLoad!=null?lastLoad+' kg':'bodyweight')+' × '+line+(last.rir!=null?' (RIR '+last.rir+')':'');
  if(last.sets.length>=e.sets && minR>=e.high){
    if(e.id==='smith_inverted_row') return {kind:'up', text:'Last: '+lastTxt+'. Every set hit '+e.high+'. Make it harder: raise your feet on the step platform.', load:lastLoad, reps:e.low};
    var nl=(lastLoad||0)+e.step;
    return {kind:'up', text:'Last: '+lastTxt+'. Every set hit '+e.high+'. Go up to '+r1(nl)+' kg and start near '+e.low+' reps.', load:nl, reps:e.low};

  return {kind:'same', text:'Last: '+lastTxt+'. Same load. Beat the reps; go up once every set reaches '+e.high+'.', load:lastLoad, reps:null, lastSets:last.sets};
}

function chart(points, opts){
  var Wd=340,Hd=150,pl=34,pr=8,pt=8,pb=20; var xs=points.map(function(p){return p.x;}), ys=points.map(function(p){return p.y;});
  (opts.extra||[]).forEach(function(l){ l.forEach(function(p){ys.push(p.y);xs.push(p.x);}); });
  if(opts.hline!=null) ys.push(opts.hline);
  if(!ys.length) return h('p',{class:'muted small'},'Nothing to plot yet.');
  var ymin=Math.min.apply(null,ys), ymax=Math.max.apply(null,ys); var padY=Math.max(0.5,(ymax-ymin)*0.15); ymin-=padY; ymax+=padY;
  var xmin=opts.xmin!=null?opts.xmin:Math.min.apply(null,xs), xmax=opts.xmax!=null?opts.xmax:Math.max.apply(null,xs); if(xmax===xmin) xmax=xmin+1;
  var X=function(x){return pl+(x-xmin)/(xmax-xmin)*(Wd-pl-pr);}, Y=function(y){return pt+(1-(y-ymin)/(ymax-ymin))*(Hd-pt-pb);};
  var svg=document.createElementNS(SVGNS,'svg'); svg.setAttribute('viewBox','0 0 '+Wd+' '+Hd); svg.setAttribute('class','chart'); svg.setAttribute('role','img'); svg.setAttribute('aria-label',opts.label);
  var html='';
  for(var i=0;i<=3;i++){ var yv=ymin+(ymax-ymin)*i/3; html+='<line x1="'+pl+'" x2="'+(Wd-pr)+'" y1="'+Y(yv)+'" y2="'+Y(yv)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pl-4)+'" y="'+(Y(yv)+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+r1(yv)+'</text>'; }
  if(opts.hline!=null) html+='<line x1="'+pl+'" x2="'+(Wd-pr)+'" y1="'+Y(opts.hline)+'" y2="'+Y(opts.hline)+'" stroke="var(--ok)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="'+(Wd-pr)+'" y="'+(Y(opts.hline)-4)+'" text-anchor="end" font-size="10" fill="var(--ok)">goal</text>';
  (opts.extra||[]).forEach(function(l){ if(l.length>1) html+='<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="'+l.map(function(p){return X(p.x)+','+Y(p.y);}).join(' ')+'"/>'; });
  if(opts.line&&points.length>1) html+='<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="'+points.map(function(p){return X(p.x)+','+Y(p.y);}).join(' ')+'"/>';
  points.forEach(function(p){ html+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="'+(opts.line?3.5:2.6)+'" fill="'+(opts.line?'var(--accent)':'var(--muted)')+'" opacity="'+(opts.line?1:.55)+'"/>'; });
  (opts.ticks||[]).forEach(function(t){ html+='<text x="'+X(t.x)+'" y="'+(Hd-5)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+t.l+'</text>'; });
  svg.innerHTML=html; return svg;
}

  app.appendChild(sec('Three rules','<ul><li><b>Overload.</b> Add reps each session until every set hits the top of the range, then add the smallest load step and start again at the bottom. The app tells you when.</li><li><b>Effort.</b> RIR = reps left in the tank. Big lifts end with 1–2 left; small isolation lifts with 0–1. If form breaks, the set is over.</li><li><b>Pain.</b> Muscle burn is fine. Joint pain 0–2 that is gone by tomorrow is fine. 3 or more, sharp, or lasting over 24 h: use the swap. Swelling, giving way, numbness or night pain in the foot or wrist: stop and see a physio.</li></ul>'));

  app.appendChild(sec('Weekly adjustment rules','<ul><li>Losing under 0.3 kg/week and waist not shrinking: cut about 150 kcal <b>or</b> add about 2,000 steps. One thing only.</li><li>Losing 0.4–0.8 kg/week and lifts rising: change nothing.</li><li>Losing over 1 kg/week or strength falling: add about 150 kcal.</li><li>After 10–12 weeks dieting: 1–2 weeks at maintenance (about 2,400 kcal).</li></ul>'));
