<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d5ed4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="icons/icon-192.png">
<title>Lean 12 – training log</title>
<meta name="description" content="Personal 12-week training log: workouts with pictures, set logger, daily log and weekly check-ins.">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eceff2; --surface:#ffffff; --surface2:#e3e8ed; --text:#131a21; --muted:#56626e; --line:#cfd7de;
  --A:#1d5ed4; --B:#8a5a00; --accent:var(--A);
  --danger:#b3261e; --ok:#18864a; --warn:#8a5a00; --on-accent:#fff;
  --disp:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1216; --surface:#171d23; --surface2:#222a32; --text:#e8edf1; --muted:#93a0ab; --line:#2b3540;
    --A:#6a9bff; --B:#f0b43a; --danger:#ff7b6b; --ok:#45c37d; --warn:#f0b43a; --on-accent:#0e1216;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1216; --surface:#171d23; --surface2:#222a32; --text:#e8edf1; --muted:#93a0ab; --line:#2b3540;
  --A:#6a9bff; --B:#f0b43a; --danger:#ff7b6b; --ok:#45c37d; --warn:#f0b43a; --on-accent:#0e1216;
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent;min-height:100vh;overflow-wrap:anywhere}
body[data-day="A"]{--accent:var(--A)} body[data-day="B"]{--accent:var(--B)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:600;letter-spacing:.01em;line-height:1.05}
main{display:block;padding:6px 14px 170px;max-width:640px;margin:0 auto}
main:focus{outline:none}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);color:var(--text);padding:0 14px;min-height:44px;display:inline-flex;align-items:center;border-radius:10px;z-index:200;font-weight:600}
.skip:focus{left:8px}
.topbar{display:flex;align-items:center;justify-content:space-between;max-width:640px;margin:0 auto;padding:6px 14px 0}
.brand{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:.02em;color:var(--muted)}
.themebtn{width:44px;height:44px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.themebtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)} .small{font-size:13.5px} .tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card>h2{font-size:22px;margin-bottom:8px}
.btn{min-height:48px;padding:0 18px;border-radius:12px;background:var(--surface2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn.danger.ghost{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.chip{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border-radius:99px;background:var(--surface2);font-size:13.5px;font-weight:500}
.chip.acc{background:var(--accent);color:var(--on-accent)}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-width:0;min-height:64px;border-radius:12px;background:var(--surface);border:2px solid var(--line);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.seg button b{font-family:var(--disp);font-size:28px;font-weight:700;line-height:1}
.seg button span{font-size:12.5px;font-weight:500}
.seg button[aria-pressed="true"]{color:var(--on-accent);border-color:transparent;background:var(--accent)}
.seg button[data-d="A"][aria-pressed="true"]{background:var(--A)} .seg button[data-d="B"][aria-pressed="true"]{background:var(--B)}
.hero{display:flex;align-items:flex-end;gap:14px;margin:4px 0 14px}
.hero .big{font-family:var(--disp);font-weight:700;font-size:96px;line-height:.8;color:var(--accent)}
.hero h1{font-size:30px} .hero p{margin:4px 0 0}
.ex{display:flex;align-items:stretch;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 8px;min-height:64px;overflow:hidden}
.ex .rail{width:6px;flex:none;background:var(--line)}
.ex.pair-top{margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:1px dashed var(--line)}
.ex.pair-bot{border-top-left-radius:0;border-top-right-radius:0;margin-bottom:8px;border-top:0}
.ex.pair-top .rail,.ex.pair-bot .rail{background:var(--accent)}
.ex.done .rail{background:var(--ok)}
.ex .tag{font-family:var(--disp);font-size:26px;font-weight:700;width:46px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.ex .mid{padding:10px 8px 10px 0;flex:1;min-width:0}
.ex .nm{font-weight:600;line-height:1.2}
.ex .st{font-family:var(--disp);font-size:20px;font-weight:600;padding:0 12px;display:flex;align-items:center;color:var(--muted);flex:none}
.ex.done .st{color:var(--ok)}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
.tabbar button{flex:1;min-width:0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:10px}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--accent)}
.sheet,.dlg,.lightbox{position:fixed;inset:0;overflow-y:auto}
.sheet{background:var(--bg);z-index:40;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(100%);transition:transform .22s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet .in{max-width:640px;margin:0 auto;padding:0 14px 170px}
.sheet .top{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 0 8px;display:flex;align-items:center;gap:8px}
.sheet .top h2{font-size:23px;flex:1;min-width:0}
.sheet .top h2:focus{outline:none}
.iconbtn{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn:disabled{opacity:.4}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;position:relative;cursor:zoom-in;width:100%}
.pair img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;border-radius:12px;border:1px solid var(--line);background:#d9eef8}
.pair .n{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:99px;background:var(--text);color:var(--bg);font:700 15px/26px var(--disp);text-align:center}
.pair .n.two{left:calc(50% + 11px)}
.credit{font-size:12px;color:var(--muted);margin:14px 2px 0}
.credit a{color:inherit;display:inline-flex;align-items:center;min-height:44px;padding:0 2px}
.setrow{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(0,1fr) 52px;gap:4px;align-items:center;margin:0 0 10px}
.setrow .n{font-family:var(--disp);font-size:26px;font-weight:700;color:var(--muted);text-align:center}
.stepper{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;height:58px}
.stepper button{width:44px;flex:none;font-size:24px;font-weight:600;color:var(--accent);background:var(--surface2)}
.stepper .val{flex:1;min-width:0;position:relative}
.stepper input{width:100%;height:100%;border:0;background:transparent;text-align:center;font-family:var(--disp);font-size:28px;font-weight:700;padding:8px 0 0;min-width:0}
.stepper .u{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:10.5px;color:var(--muted);pointer-events:none}
.check{width:52px;height:58px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center}
.check svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.sugg{border-left:5px solid var(--accent);background:var(--surface);border-radius:10px;padding:10px 12px;margin:12px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.sugg.up{border-left-color:var(--ok)} .sugg.bad{border-left-color:var(--danger)}
.sugg b{font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{min-width:46px;min-height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600;padding:0 12px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.lbl{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 8px}
summary{list-style:none;padding:11px 14px;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;color:var(--muted);font-family:var(--disp);flex:none}
details[open]>summary::after{content:"–"}
details .body{padding:0 14px 12px}
details.plain{border:0;background:transparent;margin:4px 0 0}
details.plain>summary{min-height:44px;padding:0;font-size:13.5px;color:var(--muted)}
details ul{margin:6px 0;padding-left:20px} details li{margin:3px 0}
.field{margin:0 0 12px}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.field .hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.inp{width:100%;min-width:0;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:17px}
textarea.inp{padding:10px 12px;min-height:84px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat .v{font-family:var(--disp);font-size:34px;font-weight:700;line-height:1}
.stat .k{font-size:12.5px;color:var(--muted);margin-top:4px}
.bar{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.pill{display:inline-block;padding:6px 12px;border-radius:12px;font-weight:600;font-size:14px}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--danger) 16%,var(--surface));color:var(--danger)}
.pill.idle{background:var(--surface2);color:var(--muted)}
.foodgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.food{min-height:56px;min-width:0;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:6px 10px;text-align:left}
.food b{display:block;font-size:14px;line-height:1.2} .food span{font-size:12px;color:var(--muted)}
.timer{position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--text);color:var(--bg);border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;max-width:620px;margin:0 auto;flex-wrap:nowrap}
.timer.on{display:flex} .timer.done{background:var(--ok);color:#fff}
.timer .t{font-family:var(--disp);font-size:32px;font-weight:700;min-width:58px;flex:none}
.timer .prog{flex:1;min-width:16px;height:8px;border-radius:99px;background:color-mix(in srgb,currentColor 25%,transparent);overflow:hidden}
.timer .prog i{display:block;height:100%;background:currentColor}
.timer button{flex:none;min-height:44px;padding:0 10px;border-radius:10px;background:color-mix(in srgb,currentColor 18%,transparent);color:inherit;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:80;font-weight:600;font-size:14px;max-width:90%;display:none;text-align:center}
.toast.on{display:block}
.timer.on ~ .toast{bottom:calc(168px + env(safe-area-inset-bottom,0px))}
@media (max-width:340px){.timer{gap:6px;padding:10px 8px}.timer button{padding:0 8px}.timer .t{font-size:28px;min-width:50px}}
.banner{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid var(--warn);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.pre{display:flex;gap:10px;align-items:flex-start;padding:4px 0}
.pre .check{width:48px;height:48px;flex:none}
.pre .name{font-weight:600;padding-top:12px}
svg.chart{width:100%;height:auto;display:block}
.lightbox{background:rgba(8,10,12,.94);z-index:90;visibility:hidden;-webkit-overflow-scrolling:touch}
.lightbox.on{visibility:visible}
.lightbox img{width:min(100% - 24px,640px);display:block;margin:12px auto;border-radius:12px;background:#d9eef8}
.lightbox .gap{height:64px}
.lightbox .iconbtn{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:2;background:var(--surface);color:var(--text)}
.lightbox .hint{position:fixed;top:calc(24px + env(safe-area-inset-top,0px));left:16px;right:72px;color:#cfd6dc;font-size:13px;z-index:2}
.dlg{background:rgba(8,10,12,.6);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.dlg.on{display:flex}
.dlg .box{background:var(--surface);border-radius:16px;padding:18px;max-width:420px;width:100%;border:1px solid var(--line)}
.dlg h2{font-size:24px;margin-bottom:8px}
.dlg .actions{display:grid;gap:8px;margin-top:16px}
@media (max-width:374px){.setrow{grid-template-columns:20px minmax(0,1fr) minmax(0,1fr)}.setrow .check{grid-column:2 / 4;width:100%;height:48px}}
@media (max-width:300px){.setrow{grid-template-columns:20px minmax(0,1fr)}.setrow>.n{grid-row:1 / span 3}.setrow>*:not(.n){grid-column:2}}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>

  var el = document.createElement(tag);
  if(props) for(var k in props){ var v = props[k]; if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k==='html') el.innerHTML=v;
    else if(k.slice(0,2)==='on') el.addEventListener(k.slice(2), v);
    else if(k==='value') el.value=v;
    else el.setAttribute(k, v===true?'':v); }
  for(var i=2;i<arguments.length;i++) add(el, arguments[i]);
  return el;
}
function add(el, kid){
  if(kid==null||kid===false) return;

}
